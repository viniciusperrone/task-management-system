version: '3.8'

services:
  web:
    build: .
    container_name: orizon-api
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.local
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: orizon-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.local

  pgadmin:
    image: dpage/pgadmin4
    container_name: orizon-pgadmin
    ports:
      - "5050:80"
    env_file:
      - .env.local
    depends_on:
      - db

volumes:
  postgres_data: